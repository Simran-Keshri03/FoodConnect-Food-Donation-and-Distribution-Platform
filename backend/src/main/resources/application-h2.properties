# ============================================================
# FoodConnect H2 In-Memory Profile Configuration
# ============================================================
spring.application.name=foodconnect-backend-h2
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:foodconnect_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

foodconnect.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
foodconnect.jwt.expiration-ms=86400000
foodconnect.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.vercel.app}
